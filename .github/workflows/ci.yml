name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Tests use db 1. Blank keys mean the canned nodes run, so CI needs no credentials
      # and can never make a paid call.
      TEST_REDIS_URL: redis://localhost:6379/1
      REDIS_URL: redis://localhost:6379/1
      ANTHROPIC_API_KEY: ""
      TAVILY_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        # -m "not live" excludes the tests that need real API keys. Everything else runs,
        # including the crash-resume test, which needs the Redis service above.
        run: uv run pytest --cov=ra --cov-report=term-missing --cov-fail-under=80 -m "not live"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the whole history, not just this commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
