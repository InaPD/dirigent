<!doctype html>
<meta charset="utf-8">
<title>Research run trace</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  A single static file that renders a recorded run. No build step, no dependencies.

  Browsers refuse to fetch local files, so serve the repo root rather than opening this
  directly:

      make trace

  Then pass a different run with ?fixture=fixtures/runs/your-run.json
-->
<style>
  :root {
    --bg: #fbfbfa; --fg: #1a1a1a; --dim: #6b6b6b; --line: #e2e2df;
    --ok: #1f7a4d; --warn: #9a6700; --bad: #b42318; --accent: #2b5eaa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --fg: #e8e8e6; --dim: #9a9a97; --line: #2c2e33;
      --ok: #4ec08a; --warn: #d9a441; --bad: #f0736a; --accent: #7aa7e8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--fg);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 60rem; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 .4rem; font-weight: 600; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em;
       color: var(--dim); margin: 2.5rem 0 .75rem; font-weight: 600; }
  .meta { color: var(--dim); font-size: .85rem; margin-bottom: .25rem; }
  .stats { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 1rem;
           padding: .9rem 0; border-top: 1px solid var(--line);
           border-bottom: 1px solid var(--line); }
  .stat b { display: block; font-size: 1.15rem; font-weight: 600; }
  .stat span { font-size: .75rem; color: var(--dim); text-transform: uppercase;
               letter-spacing: .05em; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th { text-align: left; font-weight: 600; color: var(--dim); font-size: .7rem;
       text-transform: uppercase; letter-spacing: .05em;
       padding: .4rem .6rem; border-bottom: 1px solid var(--line); }
  td { padding: .45rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
  .pill { font-size: .72rem; padding: .1rem .45rem; border-radius: 999px;
          border: 1px solid currentColor; white-space: nowrap; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .detail { color: var(--dim); font-size: .8rem; padding-top: .15rem; }
  .report { border: 1px solid var(--line); border-radius: 6px; padding: .5rem 1.25rem;
            background: color-mix(in srgb, var(--fg) 3%, transparent); }
  .report a { color: var(--accent); }
  .error { color: var(--bad); }
  @media (max-width: 40rem) { .hide-narrow { display: none; } body { padding: 1rem .75rem; } }
</style>

<main>
  <div id="app">Loading…</div>
</main>

<script type="module">
  const params = new URLSearchParams(location.search);
  const fixture = params.get("fixture") || "fixtures/runs/canned-example.json";
  const app = document.getElementById("app");

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const CLASS = { ok: "ok", skipped: "warn", budget_exceeded: "warn", error: "bad" };

  // The report is rendered markdown from render.py: headings, paragraphs and a source list.
  // This covers exactly that, and escapes first, so a fixture cannot inject markup.
  function markdown(src) {
    return esc(src)
      .split(/\n{2,}/)
      .map((block) => {
        const line = block.trim();
        if (!line) return "";
        if (line.startsWith("## ")) return `<h3>${line.slice(3)}</h3>`;
        if (line.startsWith("# ")) return `<h2 style="margin-top:1rem">${line.slice(2)}</h2>`;
        const linked = line.replace(/(https?:\/\/[^\s)]+)/g,
          '<a href="$1" rel="noreferrer noopener">$1</a>');
        return `<p>${linked.replace(/\n/g, "<br>")}</p>`;
      })
      .join("");
  }

  function stats(run) {
    const items = [
      [run.status, "status"],
      [`$${(run.cost_usd ?? 0).toFixed(4)}`, "cost"],
      [`${run.tokens_in ?? 0} / ${run.tokens_out ?? 0}`, "tokens in / out"],
      [run.tavily_credits ?? 0, "search credits"],
      [(run.steps || []).length, "steps"],
      [(run.findings || []).length, "findings"],
    ];
    return `<div class="stats">${items
      .map(([value, label]) => `<div class="stat"><b>${esc(value)}</b><span>${label}</span></div>`)
      .join("")}</div>`;
  }

  function rows(steps) {
    return steps.map((s) => {
      const detail = s.error || s.note;
      const tools = (s.tool_calls || [])
        .map((t) => `${t.tool.split(".").pop()}:${t.status}`).join(" ");
      return `<tr>
        <td class="num mono">${s.seq}</td>
        <td><code>${esc(s.node)}</code>${
          detail ? `<div class="detail">${esc(detail)}</div>` : ""}${
          tools ? `<div class="detail">${esc(tools)}</div>` : ""}</td>
        <td class="mono">${esc(s.sub_question_id || "")}</td>
        <td class="mono hide-narrow">${esc(s.model || "")}</td>
        <td class="num hide-narrow">${s.tokens_in || 0}</td>
        <td class="num hide-narrow">${s.tokens_out || 0}</td>
        <td class="num">${(s.cost_usd || 0).toFixed(5)}</td>
        <td class="num">${s.duration_ms || 0}</td>
        <td><span class="pill ${CLASS[s.status] || ""}">${esc(s.status)}</span></td>
      </tr>`;
    }).join("");
  }

  try {
    const response = await fetch(fixture);
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    const run = await response.json();

    app.innerHTML = `
      <h1>${esc(run.question)}</h1>
      <div class="meta mono">${esc(run.run_id)} &middot; ${esc(fixture)}</div>
      ${stats(run)}
      <h2>Trace</h2>
      <table>
        <thead><tr>
          <th class="num">#</th><th>node</th><th>sub-question</th>
          <th class="hide-narrow">model</th>
          <th class="num hide-narrow">in</th><th class="num hide-narrow">out</th>
          <th class="num">cost $</th><th class="num">ms</th><th>status</th>
        </tr></thead>
        <tbody>${rows(run.steps || [])}</tbody>
      </table>
      ${run.error ? `<p class="error">Run ended with: ${esc(run.error)}</p>` : ""}
      <h2>Report</h2>
      <div class="report">${
        run.report_markdown ? markdown(run.report_markdown) : "<p>This run produced no report.</p>"
      }</div>`;
  } catch (err) {
    app.innerHTML = `<h1>Could not load the run</h1>
      <p class="error mono">${esc(fixture)}: ${esc(err.message)}</p>
      <p>Browsers will not fetch local files. Serve the repo root instead:</p>
      <p><code>make trace</code></p>`;
  }
</script>
